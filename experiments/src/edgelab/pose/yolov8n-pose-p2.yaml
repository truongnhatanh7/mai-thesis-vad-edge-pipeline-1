# EXP-020: YOLOv8-pose with an extra stride-4 (P2) head, APPEND-ONLY layout.
# Adapted from ultralytics/cfg/models/v8/yolov8-p2.yaml (P2 branch: upsample P3 neck -> concat backbone P2 -> C2f)
# and v8/yolov8-pose.yaml (Pose head, kpt_shape [17, 3]).
# Layers 0-21 are IDENTICAL to yolov8-pose.yaml (so every stock tensor has a counterpart with the same name and shape);
# the P2 branch is layers 22-24 and the Pose head (layer 25) lists the P2 level LAST: levels P3, P4, P5 keep the head
# modules cv2/cv3/cv4.0-2 (the Pose head sizes its hidden convs from the FIRST level's channels, so putting P2 first
# would change every head tensor's shape). Strides are therefore [8, 16, 32, 4].
nc: 1 # number of classes
kpt_shape: [17, 3] # number of keypoints, number of dims (2 for x,y or 3 for x,y,visible)
scales: # [depth, width, max_channels]; used as 'yolov8n-pose-p2.yaml' -> scale n
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 10
  - [[-1, 6], 1, Concat, [1]] # 11 cat backbone P4
  - [-1, 3, C2f, [512]] # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 13
  - [[-1, 4], 1, Concat, [1]] # 14 cat backbone P3
  - [-1, 3, C2f, [256]] # 15 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]] # 16
  - [[-1, 12], 1, Concat, [1]] # 17 cat head P4
  - [-1, 3, C2f, [512]] # 18 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 19
  - [[-1, 9], 1, Concat, [1]] # 20 cat head P5
  - [-1, 3, C2f, [1024]] # 21 (P5/32-large)

  - [15, 1, nn.Upsample, [None, 2, "nearest"]] # 22 new: from the P3 neck output
  - [[-1, 2], 1, Concat, [1]] # 23 new: cat backbone P2
  - [-1, 3, C2f, [128]] # 24 new (P2/4-xsmall)

  - [[15, 18, 21, 24], 1, Pose, [nc, kpt_shape]] # 25 Pose(P3, P4, P5, P2)
