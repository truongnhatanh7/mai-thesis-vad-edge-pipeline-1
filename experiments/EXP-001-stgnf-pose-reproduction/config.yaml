  imgsz: 640
  conf: 0.25
  iou: 0.7
  ultralytics: 8.4.201
scoring:
  score_frame: {middle: 12, end: 23}   # frame of the segment that receives its score
  smoothing:
    none: {}
    offline_gaussian: {sigmas: [1, 2, 3, 4, 5, 6]}   # STG-NF smooth_scores, uses future frames
