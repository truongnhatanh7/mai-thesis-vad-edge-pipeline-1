    causal_ewma: {time_constant: 9.539}
  metric: frame-level ROC-AUC over all concatenated test frames
  bootstrap: {resamples: 2000, confidence: 0.95, unit: video, seed: 0}
stage_cost:
  video: 01_0014
  torch_threads: [1, 2, 4]
  opencv_threads: 1
