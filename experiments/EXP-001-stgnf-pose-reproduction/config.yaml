# EXP-001 exact parameters (MLflow runs log the same values as params)
machine: mac-m4pro-cpu-only
stgnf:
  repo: https://github.com/orhir/STG-NF
  commit: edb5f3220332e160e4d20ce258787d5e2d7e0200
  patch: stgnf-cpu.patch
  checkpoint: checkpoints/ShanghaiTech_85_9.tar
  checkpoint_sha256: 4950205cb5cdd3c4827e3214ac6c93dc7050c0d059c8325907cbe977360a70ca
  dataset_flag: ShanghaiTech
  seg_len: 24
  test_seg_stride: 1
