[project]
name = "edgelab"
version = "0.1.0"
description = "Thesis experiments: low-light preprocessing x OS-level CPU tuning for CPU-only public-safety edge inference"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "torch>=2.4",
    "onnx>=1.16",
    "onnxruntime>=1.19",
    "opencv-python-headless>=4.10",
    "mlflow>=2.16",
    "psutil>=6.0",
    "gdown>=5.2",
]

[project.optional-dependencies]
# AGPL-3.0: research use only, never ship in a company product (see DECISIONS.md D11).
pose = [
    "lap>=0.5.12",
    "ultralytics>=8.3",
]
ui = [
    "streamlit>=1.40",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edgelab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
