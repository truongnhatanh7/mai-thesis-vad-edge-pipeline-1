native_cells:
- - 1.0
  - 0.25
- - 1.0
  - 0.5
- - 1.0
  - 1.0
limitations:
- Power is the sum of the PMIC rail V x I products exposed by `vcgencmd pmic_read_adc` (SoC core + DDR + I/O rails), sampled at 4 Hz; it is not
  wall-socket power (no USB-C / fan / peripheral losses). Energy J/frame = mean PMIC power over the timed window x mean wall ms/frame; 'active'
  J/frame subtracts the idle floor.
- 'The `ondemand` cpufreq governor was left unchanged (changing it needs sudo): the clock ramps within ~10 ms and sat at 2.4 GHz during every
  timed window (see `freq_mhz`), but idle-floor frequency is 1.5 GHz.'
- 'Cells of about one second (JPEG / H.264 decode, user clips) contain only a few 0.25 s telemetry samples: their power and J/frame are indicative;
  the timing statistics are exact.'
- The user's text states '2,880 frames = 2 full passes over the 12 SHT clips = 2.0 minutes'. 2,880 frames at 24 fps is 120 s, and the 12 SHT timing
  clips hold 240 frames each, so 2,880 frames is exactly ONE pass of 12 x 240 frames. The live runs use 2,880 frames (2.0 minutes of 24 fps video
  per arm).
- Thread counts T in {1, 2, 3, 4} are measured (a superset of the requested T in {1, 2, 4} for decode and ORT/NCNN, and {1, 2, 3, 4} for pose).
- Pi-calibrated delivered AUCs use the measured physical pools at the native cell (s = 1.0, CPU budget beta in {0.25, 0.5, 1.0}); there is no
  VM-to-Pi multiplier. Pixel observer / C1 check costs come from the Pi `mvprof` cells (single thread).
- E02 pose cells for ML0 @640 are the E02 cell and, as second replicate, the E04 ML0 NCNN FP16 cell (same model, same input, same settings); the
  E02 simulators pool the two.
