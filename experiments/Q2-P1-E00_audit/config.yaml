scoring_protocol:
  steps:
    S0: 'offline paper: middle landing, two-sided Gaussian, global fill, last window omitted'
    S0a: 'ablation: end landing only (still two-sided Gaussian)'
    S0b: 'ablation: causal smoothing only (still middle landing)'
    S1: 'offline ''live'': end landing + causal half-Gaussian, global fill, last window omitted'
    S1a: 'ablation: omission fixed only (end landing)'
    S1b: 'ablation: completion landing only (omission kept)'
    S2: all complete windows, landed at the real completion frame, global fill
    S3: all windows, completion landing, causal half-Gaussian, empty frames = train-calibrated sentinel (hold 0)
    S4: S3 + hold last score <= H frames, H in [0, 6, 12, 24, inf]
  causal_smoother: half-Gaussian sigma=9.539392 (sqrt(sum_{s=1..6} s^2)), truncate 4 sigma
  sentinel_candidates:
  - p50
  - p90
  - p99
  - max
  hold_candidates:
  - 0
  - 6
  - 12
  - 24
  - inf
  selection_rule: ML0_mps dev split of each dataset; criterion delivered AUC; ties within 0.10 pt -> smaller H
  bootstrap:
    unit: video
    resamples_historical_rescore: 2000
    resamples_new_contrasts: 1000
    seed: 0
